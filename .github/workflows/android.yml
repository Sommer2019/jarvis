name: Android-App (APK)

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release erstellen, z.B. v0.1.0 (leer = nur APK bauen)"
        required: false
        default: ""

permissions:
  contents: write   # für GitHub-Releases bei Tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Version festlegen
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            NAME="${RELEASE_INPUT#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Signier-Schlüssel aus Secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/jarvis-${VERSION_NAME}.apk"
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::Kein Keystore in den Secrets – APK ist mit einem Debug-Schlüssel signiert. Updates erfordern ggf. Neuinstallation (siehe README)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: GitHub-Release (bei Tag v* oder manuell mit Versionsangabe)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          # bei manuellem Start legt die Action den Tag auf dem aktuellen Commit an
          tag_name: ${{ inputs.release != '' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Jarvis ${{ inputs.release != '' && inputs.release || github.ref_name }}
          files: out/*.apk
          generate_release_notes: true

name: Tests

on:
  push:
    paths-ignore: ["android/**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: GreenMail (IMAP/SMTP-Testserver) laden
        run: curl -fsSL -o greenmail.jar https://repo.maven.apache.org/maven2/com/icegreen/greenmail-standalone/2.1.3/greenmail-standalone-2.1.3.jar
      - run: pytest -q -rs
        env:
          GREENMAIL_JAR: greenmail.jar
